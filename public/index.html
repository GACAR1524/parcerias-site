<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Parcerias Costa de Araújo</title>
<link rel="icon" href="img/mono.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- BEGIN APP MARKUP (compartilhado com a versão artifact; o build copia daqui) -->
<div id="app">
  <div class="login" id="login-screen">
    <div class="login-card">
      <div class="login-brand"><img src="img/logo.png" alt="Costa de Araújo — Advocacia &amp; Consultoria Jurídica" width="720" height="373"></div>
      <div class="login-body" id="login-body">
        <h1>Gestão de Parcerias</h1>
        <p class="lead">Acesso restrito ao escritório e aos advogados parceiros.</p>
        <form id="login-form" autocomplete="on">
          <div class="field"><label for="lg-user">Usuário</label><input type="text" id="lg-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
          <div class="field"><label for="lg-pass">Senha</label><input type="password" id="lg-pass" name="password" autocomplete="current-password" required></div>
          <label class="check" for="lg-remember"><input type="checkbox" id="lg-remember" checked><span>Manter conectado neste dispositivo</span></label>
          <button class="btn btn-primary" type="submit" id="lg-btn" disabled>Entrar</button>
          <p class="status" id="lg-status">Conectando…</p>
        </form>
        <div id="owner-tools" hidden style="text-align:center;margin-top:10px"><button class="btn-link" type="button" id="btn-reset-admin">Redefinir a senha do administrador</button></div>
      </div>
      <p class="login-foot">Costa de Araújo · Advocacia &amp; Consultoria Jurídica</p>
    </div>
  </div>
  <div id="shell" hidden></div>
</div>
<div id="modal-root"></div>
<div id="tip" class="tip" hidden></div>
<!-- END APP MARKUP -->
<script src="api-rest.js"></script>
<script src="app.js"></script>
</body>
</html>
